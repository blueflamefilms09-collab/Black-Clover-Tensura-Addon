plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id
base { archivesName = "multiverse-of-anime" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = "MaxHenkel"
        url = "https://maven.maxhenkel.de/repository/public"
        content { includeGroup "de.maxhenkel.voicechat" }
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
}

// ManasCore ships its modules (skill, storage, network...) as jars inside one jar.
// This task unpacks them so we can compile against them.
def extractedManasCoreDir = layout.buildDirectory.dir("extracted-deps/manascore")
configurations {
    manasCoreBundle { canBeResolved = true; canBeConsumed = false; transitive = false }
}
tasks.register("extractManasCoreModules", Copy) {
    inputs.files(configurations.manasCoreBundle)
    from { configurations.manasCoreBundle.collect { zipTree(it).matching { include "**/*.jar" } } }
    into extractedManasCoreDir
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client {
        // CI screenshot run (.github/workflows/clientshot.yml): ./gradlew runClient -Pclientshot
        if (project.hasProperty('clientshot')) {
            jvmArgument '-Dnusmp.clientshot=1'
            argument '--width'
            argument '960'
            argument '--height'
            argument '540'
        }
    }
    server { argument '--nogui' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // Headless VFX rule checks (gradle build runs them; a failing effect blocks the jar)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' 

    manasCoreBundle "curse.maven:manascore-619025:8022425"
    implementation "curse.maven:manascore-619025:8022425"
    implementation fileTree(dir: extractedManasCoreDir.get().asFile, include: ["**/*.jar"])

    implementation "curse.maven:architectury-api-419699:5786327"
    implementation "curse.maven:geckolib-388172:8350073"
    implementation "curse.maven:smartbrainlib-661293:7055149"
    // Tensura: Reincarnated (built against 2.0.1.0; runs fine on 2.0.1.3)
    implementation "curse.maven:tensura-reincarnated-643695:8098859"
    // 1.43.0: Simple Voice Chat API, compile only (Song Magic reads the microphone through it when the mod is installed)
    compileOnly "de.maxhenkel.voicechat:voicechat-api:2.5.0"
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named("extractManasCoreModules")
    options.encoding = 'UTF-8'
}

// 3.32.0: the big text meshes go into the jar in the compact packed form (mesh/MeshPack.java, same file names; the loaders read both forms).
// The source tree and build/resources keep the plain text, so the tests and the dev runs read text; only the jar gets the packed copies.
// Setting -PpackMeshes=false builds a jar with the plain text.
def meshFolders = ["weapon_meshes", "weapon_meshes_vu", "weapon_meshes_sz", "weapon_meshes_vu_sz", "djinn"]
def packedMeshDir = layout.buildDirectory.dir("packed-meshes")
def meshRoot = layout.projectDirectory.dir("src/main/resources/assets/nusmp")
def packMeshesOn = !(project.findProperty("packMeshes") in ["false", false])
// the fixed detail limit of the big meshes in the jar, in quads (mesh/MeshCap.java); -PmeshQuadCap=0 keeps every quad
def meshCap = (project.findProperty("meshQuadCap") ?: "3000").toString().toInteger()
def meshCapDump = project.findProperty("meshCapDump")
tasks.register("packMeshes", JavaExec) {
    group = "build"
    description = "Packs the big text meshes into build/packed-meshes (they replace the text copies in the jar)"
    classpath = sourceSets.main.output.classesDirs
    mainClass = "com.newuniverse.nusmp.mesh.MeshPackMain"
    maxHeapSize = "2g"
    systemProperty "nusmp.meshQuadCap", meshCap
    if (meshCapDump) systemProperty "nusmp.meshCapDump", meshCapDump.toString()
    inputs.property("meshQuadCap", meshCap)
    args(meshRoot.asFile.absolutePath, packedMeshDir.get().asFile.absolutePath, *meshFolders)
    inputs.files(meshFolders.collect { meshRoot.dir(it) }).withPropertyName("meshFolders")
    inputs.files(sourceSets.main.output.classesDirs)
    outputs.dir(packedMeshDir)
    doFirst { packedMeshDir.get().asFile.deleteDir() }
}
tasks.named("jar") {
    if (packMeshesOn) {
        dependsOn tasks.named("packMeshes")
        from(packedMeshDir) { into "assets/nusmp" }
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
        // the plain text twin of a packed mesh stays out of the jar
        eachFile { FileCopyDetails d ->
            File packed = packedMeshDir.get().asFile
            if (!d.file.toPath().startsWith(packed.toPath()) && d.relativePath.pathString.startsWith("assets/nusmp/")) {
                String rel = d.relativePath.pathString.substring("assets/nusmp/".length())
                if (new File(packed, rel).isFile()) d.exclude()
            }
        }
    }
}

test {
    useJUnitPlatform()
    testLogging { events "failed"; exceptionFormat "full" }
}
