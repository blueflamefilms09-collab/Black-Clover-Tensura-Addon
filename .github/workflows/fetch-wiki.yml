# Developer helper: prints Black Clover wiki pages (wikitext, via the MediaWiki API) into the job log, so spells can be checked
# against the source from a session that cannot reach the wiki. Runs when .github/wiki-request.txt changes (one page title per line).
name: Fetch wiki reference

on:
  push:
    paths: [ ".github/wiki-request.txt" ]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print pages
        run: |
          while IFS= read -r page; do
            [ -z "$page" ] && continue
            echo "=================== PAGE: $page ==================="
            curl -sSL --max-time 60 -A "Mozilla/5.0 (reference fetch for a fan mod)" \
              "https://blackclover.fandom.com/api.php?action=parse&page=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$page")&prop=wikitext&format=json&formatversion=2" \
              | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("parse",{}).get("wikitext","(no wikitext) " + str(d)[:400]))' \
              | sed -E 's/\{\{[Rr]ef[^}]*\}\}//g; s/<ref[^>]*>[^<]*<\/ref>//g; s/<ref[^>]*\/>//g' | cut -c1-400 | head -700
          done < .github/wiki-request.txt
