# Developer helper: dumps the public/protected API (javap) of the classes named in .github/api-request.txt into
# .github/api/api.tar.gz and commits it (by the workflow's own token, which does not start other workflows), so a session that
# cannot download the Minecraft / NeoForge / Tensura jars can grep exact method signatures instead of guessing them.
name: Dump dependency API
on:
  push:
    paths: [ ".github/api-request.txt" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve dependencies
        run: |
          chmod +x gradlew
          ./gradlew extractManasCoreModules compileJava --no-daemon -q > /dev/null 2>&1 || true
      - name: Dump
        run: python3 .github/scripts/dump_api.py
      - name: Commit
        run: |
          git config user.name "api-dump"
          git config user.email "api-dump@users.noreply.github.com"
          git add .github/api
          git diff --cached --quiet || git commit -m "Dependency API dump"
          git push || true
