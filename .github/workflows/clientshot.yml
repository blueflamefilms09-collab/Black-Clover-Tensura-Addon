# Starts the real game CLIENT in a virtual display with a software GL driver, equips two armour relics on the player, and prints screenshots (as text, so they can be read from the log) and what the worn
# layer decided. Why: the worn armour relics could only ever be reasoned about; this is the one place they are SEEN. See client/debug/ClientShot.java.
# Runs only for a push whose commit message contains  [clientshot]  (use  [no-build]  with it so no release is published), or by hand.
name: Client screenshot

on:
  push:
    branches: [ "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write        # 3.83.1: the hero weapon contact sheets are committed to the pushed branch (docs/previews/ingame), nothing else is written

jobs:
  shot:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[clientshot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Packages for a virtual display and software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libglu1-mesa mesa-utils libxxf86vm1 libxrandr2 libxinerama1 libxcursor1 libxi6 libopenal1 python3-pil

      - name: TerraBlender jar (Tensura needs it; the project does not declare it)
        run: |
          mkdir -p run/client/mods
          python3 - <<'PY2'
          import json, urllib.parse, urllib.request
          q = urllib.parse.urlencode({"loaders": json.dumps(["neoforge"]), "game_versions": json.dumps(["1.21.1"])})
          req = urllib.request.Request("https://api.modrinth.com/v2/project/terrablender/version?" + q, headers={"User-Agent": "nusmp-ci-clientshot/1.0"})
          for v in json.load(urllib.request.urlopen(req, timeout=60)):
              for f in v.get("files", []):
                  if f.get("primary", True) and f["filename"].endswith(".jar"):
                      urllib.request.urlretrieve(f["url"], "run/client/mods/" + f["filename"])
                      print("downloaded", f["filename"])
                      raise SystemExit(0)
          raise SystemExit("no TerraBlender jar found")
          PY2

      - name: Run the client and take the screenshots
        run: |
          chmod +x gradlew
          mkdir -p run/client
          printf 'onboardAccessibility:false\nguiScale:2\ntutorialStep:none\nskipMultiplayerWarning:true\nrenderDistance:4\nsimulationDistance:5\nmaxFps:30\nenableVsync:false\nfullscreen:false\n' > run/client/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe MESA_GL_VERSION_OVERRIDE=4.5 MESA_GLSL_VERSION_OVERRIDE=450 ALSOFT_DRIVERS=null
          printf 'drivers = null\n' > "$HOME/.alsoftrc"
          set -o pipefail
          # a hard 20 minute limit: a game that failed to load must not hang the job for an hour
          timeout --signal=KILL 20m xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -Pclientshot --no-daemon --console=plain 2>&1 | tee client.log || true
          pkill -9 java || true

      - name: Screenshots as text (base64 JPEG, decode with the SHOT lines)
        if: always()
        run: |
          python3 - <<'PY'
          import glob, base64, io
          from PIL import Image
          for p in sorted(glob.glob('run/client/clientshot/*.png')):
              im = Image.open(p).convert('RGB')
              w, h = im.size
              for tag, box, scale in (('mid', (w // 2 - 200, h // 2 - 180, w // 2 + 200, h // 2 + 180), 2),):
                  c = im.crop(box)
                  if scale != 1:
                      c = c.resize((c.width * scale, c.height * scale), Image.LANCZOS)
                  buf = io.BytesIO()
                  c.save(buf, 'JPEG', quality=80)
                  b = base64.b64encode(buf.getvalue()).decode()
                  print('SHOTBEGIN', p.split('/')[-1], tag, c.size, len(b))
                  for i in range(0, len(b), 200):
                      print('SHOT', b[i:i + 200])
                  print('SHOTEND')
          PY

      - name: Hero weapon contact sheets, committed to this branch (docs/previews/ingame)
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os
          from PIL import Image, ImageDraw
          os.makedirs('docs/previews/ingame', exist_ok=True)
          for kind, tile in (('hero3', (300, 300)), ('hero1', (320, 240))):
              files = sorted(glob.glob('run/client/clientshot/%s_*.png' % kind))
              if not files:
                  continue
              cols = 7
              rows = (len(files) + cols - 1) // cols
              sheet = Image.new('RGB', (cols * tile[0], rows * (tile[1] + 14)), (16, 18, 24))
              d = ImageDraw.Draw(sheet)
              for i, p in enumerate(files):
                  im = Image.open(p).convert('RGB')
                  w, h = im.size
                  if kind == 'hero3':                                    # the player in the middle of the frame
                      box = (w // 2 - 240, h // 2 - 260, w // 2 + 240, h // 2 + 220)
                  else:                                                  # first person: the right half, where the hand is
                      box = (w // 2 - 80, h // 4, w, h)
                  c = im.crop(box).resize(tile, Image.LANCZOS)
                  x, y = (i % cols) * tile[0], (i // cols) * (tile[1] + 14)
                  sheet.paste(c, (x, y + 14))
                  d.text((x + 4, y + 2), os.path.basename(p)[len(kind) + 1:-4], fill=(255, 220, 120))
              sheet.save('docs/previews/ingame/%s.jpg' % ('hero_third_person' if kind == 'hero3' else 'hero_first_person'), quality=82)
              print('sheet', kind, sheet.size, len(files))
          PY
          if ls docs/previews/ingame/*.jpg >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/previews/ingame
            git commit -m "In-game screenshots of the hero weapons (from the client screenshot run) [skip ci]" || exit 0
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: What the driver and the worn layer said
        if: always()
        run: |
          grep -E "clientshot|\[CHAT\]|nusmp.*(WARN|ERROR)|Exception|armour relic" client.log | grep -v "Saving chunks" | head -200 || true
          echo "---- who emptied the slot ----"
          grep -A32 "emptied by" client.log | head -150 || true
          echo "---- first errors and the mod loading failure ----"
          grep -n -m 60 -E "ERROR|Mod loading has failed|ModLoading|Failed to|Caused by" client.log || true
          echo "---- tail ----"
          tail -n 60 client.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-shots
          path: |
            client.log
            run/client/clientshot/
            run/client/logs/
          if-no-files-found: ignore
