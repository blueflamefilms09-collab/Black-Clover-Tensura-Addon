# Boots the mod in a real headless dedicated server and drives it through RCON (tools/ci/server_smoke.py): datapack registries decode, the dimensions load,
# structures place, the Mega-Dungeon generator builds, audits, expands and saves sectors. This is the only place the game itself runs.
#
# It only runs for a push whose commit message contains  [smoke]  (in addition to the normal build) or  [smoke-only]  (INSTEAD of the normal build:
# build.yml skips itself for that token, so no release is published for a commit that only wants the smoke test), or when started by hand.
# Why a token and not every push: a server boot needs the whole NeoForge dev setup (several minutes) and most pushes are not about world generation.
name: Server smoke test

on:
  push:
    branches: [ "claude/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[smoke]') || contains(github.event.head_commit.message, '[smoke-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Boot the server and run the smoke checks
        env:
          # through the environment, never pasted into the script text: a commit message is free text
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          # the systems of this build that must each have registered self-tests (edit this list when a system is added)
          SMOKE_EXPECT: "core,safe,enc,eco,guard,theme,floors,hub,macro,system,lock,flow,gear,stairs,arc,avatar,party,arcworld,hero,skillbook,mech,foundry,gen,elite.hub,compat.maps,djinn.core_rebuild,magic.shakudo_rebuild,magic.earth_family_rebuild,magic.song_rebuild,magic.water_rebuild,magic.tree_rebuild,rift,puzzle,compat.create,antimagic.aura,render.playermodel,guard.abyssal_looks,enc.trigger,skill.fairytail,relic.worn_render,skill.erza_requip,relic.elsdocia,relic.grade_damage,magic.celestial_keys,relic.new197,dungeon.admin,magic.armour_policy,relic.worn_render2,mana.zone_gate,mana.zone_core,render.playermodel2,dungeon.nohunger,audio.mob_sounds,enc.squads,loot.functional,skill.erza_requip2,boss.decennial_roster,boss.decennial_arena,magic.spirit_looks,rift.pockets,rift.mega_rare,skill.requip_magic,perf,relic.attune_lock,djinn.bc_bind,ui.dungeon_map,vfx.square_bug,visual.god_melee_b,boss.bars,visual.god_melee_a,visual.charms_genesis_worn,djinn.tiny,particles,visual.genesis_weapons,visual.god_worn,dungeon.guard_exempt,dungeon.poise,dungeon.clearance7,dungeon.music,dungeon.props,dungeon.loot_luck,dungeon.lockdown,visual.demon_slayer,visual.djinn_dark_weapons,ui.unified_tooltips,visual.weapon_sizes,visual.shields,visual.upgrade_particles,visual.safe_additive,visual.armor_slot_relics,visual.duel_disk,visual.deck_summon,audio.voices,relic.special_normal_a,relic.normal_b,relic.normal_c,relic.god_special_new,relic.genesis_new,item.franchise_engravings,relic.armor_visible,item.weapon_grip,magic.rades_undead,magic.compass_3d,magic.recomb_anime,magic.storm_staff,magic.light_bone_ja,visual.flat_props,perf.lag_audit_1,item.engraving_codex,magic.fire_casting,magic.salamander_moods,magic.scale_casting,magic.gnome,magic.spirit_dark,magic.spirit_light,magic.spirit_space,magic.sylph,magic.undine,relic.wear,dungeon.rooms_rebuilt,relic.shishou,relic.ex_singularity,magic.soul_corpse_cast,magic.character_spells,magic.noelle_forms,magic.spirit_control,magic.spirit_combat,magic.character_spells_rest,magic.character_spells_bulls,magic.character_spells_gold,magic.spirit_dive_looks,magic.fuegoleon_arm,magic.basic_grimoires,magic.fuegoleon_arm_djinn,magic.spirit_dive_djinn,magic.spirit_dive_anime,magic.spirit_dive_reel,magic.spirit_dive_wind,magic.spirit_dive_wind3,magic.spirit_blades,magic.spirit_dive_windfinal,magic.spirit_dive_merge,magic.pages15,magic.spirit_dive_merge2,magic.mode_wind_v2,magic.wind_mc,magic.water_bc,magic.fire_v2,magic.mana_method,magic.zone_up,magic.ultimate,magic.companions,magic.valkyrie_armor,magic.star_nodes,relic.display39,relic.x3"
        run: |
          chmod +x gradlew
          # [strict] in the commit message: a missing pool, structure or command is a failure (use it on the integrated build)
          STRICT=""
          if [[ "$COMMIT_MESSAGE" == *"[strict]"* ]]; then STRICT="--strict"; fi
          python3 tools/ci/server_smoke.py --sectors 3 --restart --quiet $STRICT 2>&1 | tee smoke.log

      - name: Mod-related lines of the server log
        if: always()
        run: |
          mkdir -p run/smoke
          grep -hE "nusmp|Mega|MEGA|multiverse" run/smoke/server_*.log 2>/dev/null | grep -E "ERROR|WARN|Exception|MEGA" | head -80 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-smoke
          path: |
            smoke.log
            run/smoke/
            run/server/logs/
            run/server/crash-reports/
            run/server/mega_plan_*.json
          if-no-files-found: ignore
