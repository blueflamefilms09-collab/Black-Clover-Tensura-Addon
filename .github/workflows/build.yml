# Builds the mod jar on GitHub's servers and publishes it as a (pre-)release you can download:
# GitHub repo -> Releases -> "Multiverse <version> (build N)" -> multiverse-of-anime-<version>.jar
name: Build mod jar

on:
  push:
    branches: [ main, master, "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (compiles, runs the tests, makes the jar)
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon

      - name: Read version
        id: ver
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: multiverse-of-anime-${{ steps.ver.outputs.version }}
          path: build/libs/*.jar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-b${{ github.run_number }}
          name: Multiverse ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Mod jar built from `${{ github.ref_name }}` at ${{ github.sha }}.
            Put `multiverse-of-anime-${{ steps.ver.outputs.version }}.jar` in your `mods` folder and remove any older multiverse-of-anime jar.
          files: build/libs/multiverse-of-anime-${{ steps.ver.outputs.version }}.jar
